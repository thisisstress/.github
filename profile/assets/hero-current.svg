<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">THIS IS STRESS animated research hero</title>
  <desc id="desc">An abstract animated health-data flow combining global tree structure and local pair-neighbor structure into a final prediction signal. Visible text is intentionally omitted so profile copy remains separate and accessible.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A23"/>
      <stop offset="0.48" stop-color="#071F1A"/>
      <stop offset="1" stop-color="#03110F"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#63B394" stop-opacity=".30"/>
      <stop offset="1" stop-color="#63B394" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.83" cy="0.50" r="0.60">
      <stop offset="0" stop-color="#F2C75C" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F2C75C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76C4A5"/>
      <stop offset="0.55" stop-color="#D6AA3D"/>
      <stop offset="1" stop-color="#F3D67C"/>
    </linearGradient>
    <linearGradient id="finalOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0AF"/>
      <stop offset="0.38" stop-color="#EFC95D"/>
      <stop offset="1" stop-color="#9E6B13"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tiny" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <clipPath id="panelClip"><rect x="35" y="28" width="1130" height="304" rx="30"/></clipPath>
    <style>
      .floatA{transform-box:fill-box;transform-origin:center;animation:floatA 7s ease-in-out infinite}
      .floatB{transform-box:fill-box;transform-origin:center;animation:floatB 9s ease-in-out infinite}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 1.25s}
      .pulse3{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 2.5s}
      .dash{stroke-dasharray:12 12;animation:dash 10s linear infinite}
      .flow{stroke-dasharray:900;stroke-dashoffset:900;animation:flow 6.5s ease-in-out infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}
      .orbitR{transform-box:fill-box;transform-origin:center;animation:spinR 34s linear infinite}
      .spark{animation:spark 4.8s ease-in-out infinite}
      .spark2{animation:spark 4.8s ease-in-out infinite 1.6s}
      .spark3{animation:spark 4.8s ease-in-out infinite 3.2s}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-5px)}}
      @keyframes pulse{0%,100%{transform:scale(.88);opacity:.62}50%{transform:scale(1.16);opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-240}}
      @keyframes flow{0%{stroke-dashoffset:900;opacity:.18}45%,78%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-900;opacity:.18}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinR{to{transform:rotate(-360deg)}}
      @keyframes spark{0%,100%{opacity:.15}45%{opacity:.95}}
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glowA)"/>
  <rect width="1200" height="360" fill="url(#glowB)"/>

  <g clip-path="url(#panelClip)">
    <path d="M-40 72 C170 8 316 28 468 106" fill="none" stroke="#8CC8AF" stroke-opacity=".12" stroke-width="38" filter="url(#soft)"/>
    <path d="M755 330 C928 280 1054 286 1248 220" fill="none" stroke="#E7BE52" stroke-opacity=".10" stroke-width="46" filter="url(#soft)"/>

    <g opacity=".72">
      <circle class="spark" cx="80" cy="56" r="2.2" fill="#F1CF70"/>
      <circle class="spark2" cx="156" cy="98" r="1.7" fill="#7FC1A5"/>
      <circle class="spark3" cx="1090" cy="78" r="2.1" fill="#F1CF70"/>
      <circle class="spark" cx="1040" cy="286" r="1.8" fill="#83C2A8"/>
      <circle class="spark2" cx="690" cy="58" r="1.7" fill="#F4D986"/>
      <circle class="spark3" cx="532" cy="304" r="2.0" fill="#75B99C"/>
    </g>

    <!-- health-signal cluster -->
    <g class="floatA" filter="url(#shadow)">
      <circle cx="138" cy="180" r="78" fill="#0E382D" fill-opacity=".86" stroke="#4F9A7D" stroke-width="2"/>
      <circle cx="138" cy="180" r="55" fill="none" stroke="#75B79D" stroke-opacity=".45" stroke-width="1.4" class="dash"/>
      <path d="M78 188 C94 188 99 151 115 151 C132 151 132 214 149 214 C165 214 169 168 184 168 C198 168 205 188 219 188" fill="none" stroke="#E7C65F" stroke-width="3.2" stroke-linecap="round" class="flow"/>
      <circle class="pulse" cx="104" cy="139" r="7" fill="#72BEA0" stroke="#C7E7D8"/>
      <circle class="pulse2" cx="173" cy="135" r="6" fill="#D8A83D" stroke="#FFE49A"/>
      <circle class="pulse3" cx="192" cy="221" r="7" fill="#72BEA0" stroke="#C7E7D8"/>
      <circle cx="94" cy="229" r="5" fill="#D8A83D" stroke="#FFE49A"/>
    </g>

    <!-- global tree branch -->
    <g class="floatB" stroke-linecap="round" stroke-linejoin="round">
      <path d="M355 180 L355 124 M355 144 L310 105 M355 144 L400 105 M310 105 L282 76 M310 105 L330 72 M400 105 L380 72 M400 105 L432 78" fill="none" stroke="#83BEA5" stroke-width="2.4"/>
      <path d="M355 180 L355 226 M355 204 L316 247 M355 204 L396 247 M316 247 L288 278 M316 247 L336 282 M396 247 L378 282 M396 247 L430 277" fill="none" stroke="#CBA443" stroke-width="2.4"/>
      <circle class="pulse" cx="355" cy="180" r="13" fill="#DCAA3D" stroke="#FFE596" stroke-width="1.8" filter="url(#tiny)"/>
      <g fill="#174839" stroke="#9ED0BA" stroke-width="1.5">
        <circle cx="310" cy="105" r="9"/><circle cx="400" cy="105" r="9"/><circle cx="282" cy="76" r="6"/><circle cx="330" cy="72" r="6"/><circle cx="380" cy="72" r="6"/><circle cx="432" cy="78" r="6"/>
      </g>
      <g fill="#5A431A" stroke="#EFD17B" stroke-width="1.5">
        <circle cx="316" cy="247" r="9"/><circle cx="396" cy="247" r="9"/><circle cx="288" cy="278" r="6"/><circle cx="336" cy="282" r="6"/><circle cx="378" cy="282" r="6"/><circle cx="430" cy="277" r="6"/>
      </g>
    </g>

    <!-- local pair-neighbor branch -->
    <g filter="url(#shadow)">
      <rect x="522" y="98" width="238" height="164" rx="26" fill="#0B3027" fill-opacity=".82" stroke="#4D886F" stroke-width="1.6"/>
      <g opacity=".92">
        <path d="M558 132 H724 M558 166 H724 M558 200 H724 M558 234 H724" stroke="#365E50" stroke-width="1"/>
        <path d="M592 116 V246 M626 116 V246 M660 116 V246 M694 116 V246" stroke="#365E50" stroke-width="1"/>
      </g>
      <g fill="#79BBA0" opacity=".76">
        <circle cx="575" cy="149" r="4"/><circle cx="608" cy="184" r="4"/><circle cx="645" cy="216" r="4"/><circle cx="706" cy="145" r="4"/><circle cx="676" cy="183" r="4"/>
      </g>
      <circle class="pulse2" cx="662" cy="184" r="9" fill="#E0AD3B" stroke="#FFE69A" stroke-width="2" filter="url(#tiny)"/>
      <circle cx="646" cy="200" r="5" fill="#F3D67C"/>
      <path d="M662 184 L646 200" stroke="#F3D67C" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <!-- two branches merge -->
    <path d="M448 180 C500 180 492 154 522 154" fill="none" stroke="#75B99D" stroke-width="3" stroke-opacity=".75" class="flow"/>
    <path d="M760 180 C820 180 822 180 866 180" fill="none" stroke="url(#signal)" stroke-width="4" class="flow"/>

    <!-- override/local match accent -->
    <g class="orbit" opacity=".46">
      <ellipse cx="916" cy="180" rx="82" ry="52" fill="none" stroke="#E5BD55" stroke-width="1.5" class="dash"/>
      <circle cx="989" cy="157" r="5" fill="#F2D16F" filter="url(#tiny)"/>
    </g>
    <g class="orbitR" opacity=".30">
      <ellipse cx="916" cy="180" rx="62" ry="76" fill="none" stroke="#71B79A" stroke-width="1.4" class="dash"/>
      <circle cx="884" cy="245" r="4" fill="#85C5A8"/>
    </g>

    <!-- final prediction orb -->
    <g filter="url(#shadow)">
      <circle cx="1042" cy="180" r="74" fill="#0B2C24" stroke="#B78B2B" stroke-width="2"/>
      <circle class="pulse" cx="1042" cy="180" r="45" fill="url(#finalOrb)" opacity=".96" filter="url(#soft)"/>
      <circle cx="1042" cy="180" r="22" fill="#FFF1B4" opacity=".92"/>
      <circle cx="1029" cy="165" r="7" fill="#FFF9DD" opacity=".72"/>
    </g>

    <path d="M1106 180 C1144 180 1162 180 1218 180" fill="none" stroke="#E7C761" stroke-width="3.2" stroke-linecap="round" class="flow"/>
  </g>

  <rect x="35" y="28" width="1130" height="304" rx="30" fill="none" stroke="#8DB7A5" stroke-opacity=".24" stroke-width="1"/>
</svg>
