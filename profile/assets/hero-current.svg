<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">THIS IS STRESS current research result hero</title>
  <desc id="desc">A polished emerald and gold research banner for the ExtraTrees and Pair-Neighbor public result.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f27"/>
      <stop offset="0.42" stop-color="#06241d"/>
      <stop offset="1" stop-color="#00120f"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0.15" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#79b397" stop-opacity=".34"/>
      <stop offset="0.46" stop-color="#2b6d55" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00120f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.55" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#e8b23d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e8b23d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe7d0"/>
      <stop offset="0.5" stop-color="#f2cf67"/>
      <stop offset="1" stop-color="#c89224"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3329" stop-opacity=".96"/>
      <stop offset="1" stop-color="#041d18" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67b08c"/>
      <stop offset="0.6" stop-color="#d6a42d"/>
      <stop offset="1" stop-color="#f2cf67"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="plotClip"><rect x="824" y="285" width="340" height="102" rx="14"/></clipPath>
    <style>
      .sans { font-family: Inter, "Noto Sans KR", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .floatA { transform-box: fill-box; transform-origin: center; animation: floatA 8s ease-in-out infinite; }
      .floatB { transform-box: fill-box; transform-origin: center; animation: floatB 10s ease-in-out infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
      .pulse2 { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite 1.2s; }
      .pulse3 { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite 2.4s; }
      .orbit1 { transform-box: fill-box; transform-origin: center; animation: orbitSpin 24s linear infinite; }
      .orbit2 { transform-box: fill-box; transform-origin: center; animation: orbitSpinReverse 31s linear infinite; }
      .dash { stroke-dasharray: 16 12; animation: dashMove 9s linear infinite; }
      .wave { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: drawWave 7.5s ease-in-out infinite; }
      .spark { animation: twinkle 5s ease-in-out infinite; }
      .spark2 { animation: twinkle 5s ease-in-out infinite 1.7s; }
      .spark3 { animation: twinkle 5s ease-in-out infinite 3.2s; }
      .metric { transform-box: fill-box; transform-origin: center; animation: metricBreathe 6s ease-in-out infinite; }
      .shine { animation: shine 7s ease-in-out infinite; }
      @keyframes floatA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5px,-5px)} }
      @keyframes pulse { 0%,100%{transform:scale(.92);opacity:.72} 50%{transform:scale(1.12);opacity:1} }
      @keyframes orbitSpin { to{transform:rotate(360deg)} }
      @keyframes orbitSpinReverse { to{transform:rotate(-360deg)} }
      @keyframes dashMove { to{stroke-dashoffset:-280} }
      @keyframes drawWave { 0%{stroke-dashoffset:1200;opacity:.25} 42%,82%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:-1200;opacity:.25} }
      @keyframes twinkle { 0%,100%{opacity:.2} 45%{opacity:1} }
      @keyframes metricBreathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes shine { 0%,18%,100%{opacity:0;transform:translateX(-80px)} 42%{opacity:.9} 62%{opacity:0;transform:translateX(720px)} }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#leftGlow)"/>
  <rect width="1200" height="420" fill="url(#goldGlow)"/>

