<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Final presentation workflow animation</title>
  <desc id="desc">Text-free animated five-stage workflow: health data, train-only preprocessing, feature engineering, hybrid modeling, and validation with final selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="0.55" stop-color="#F1F7F4"/>
      <stop offset="1" stop-color="#FBF7EA"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DA987"/>
      <stop offset="0.52" stop-color="#2F8061"/>
      <stop offset="1" stop-color="#D4A83A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55A680"/>
      <stop offset="1" stop-color="#19533F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D477"/>
      <stop offset="1" stop-color="#B47A15"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123F33" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow{stroke-dasharray:18 14;animation:flow 8s linear infinite}
      .stage{transform-box:fill-box;transform-origin:center;animation:lift 10s ease-in-out infinite}
      .s2{animation-delay:1.6s}.s3{animation-delay:3.2s}.s4{animation-delay:4.8s}.s5{animation-delay:6.4s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 1.25s}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
      .scan{animation:scan 5.5s ease-in-out infinite}
      .check{stroke-dasharray:60;stroke-dashoffset:60;animation:check 5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-320}}
      @keyframes lift{0%,14%,100%{transform:translateY(0)}7%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{transform:scale(.88);opacity:.68}50%{transform:scale(1.12);opacity:1}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes scan{0%,100%{opacity:.08;transform:translateX(-44px)}48%{opacity:.42}65%{opacity:0;transform:translateX(95px)}}
      @keyframes check{0%,28%{stroke-dashoffset:60}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
    </style>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="100" cy="315" r="150" fill="#B7E0CE" opacity=".13"/>
  <circle cx="1110" cy="25" r="170" fill="#F2DC91" opacity=".14"/>

  <!-- main track -->
  <path d="M112 165 H1088" fill="none" stroke="#D5E2DB" stroke-width="8" stroke-linecap="round"/>
  <path d="M112 165 H1088" fill="none" stroke="url(#track)" stroke-width="5" stroke-linecap="round" class="flow"/>

  <!-- stage 1: health data -->
  <g class="stage" filter="url(#shadow)">
    <rect x="45" y="78" width="180" height="174" rx="30" fill="#FFFFFF" stroke="#D6E6DE" stroke-width="2"/>
    <circle cx="135" cy="165" r="56" fill="#EEF7F2" stroke="#62A988" stroke-width="2"/>
    <circle cx="119" cy="145" r="14" fill="#D7ECE2" stroke="#4F9777" stroke-width="2"/>
    <path d="M111 145h16M119 137v16" stroke="#347A5D" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="151" cy="181" r="13" fill="#F5EDCF" stroke="#D1AC45" stroke-width="2"/>
    <path d="M144 184c4-11 11-11 15 0M145 176h13" fill="none" stroke="#9D771D" stroke-width="2" stroke-linecap="round"/>
    <circle class="pulse" cx="155" cy="139" r="5" fill="#4F9777"/>
    <circle class="pulse2" cx="114" cy="184" r="5" fill="#C9992B"/>
  </g>

  <!-- stage 2: preprocessing -->
  <g class="stage s2" filter="url(#shadow)">
    <rect x="275" y="78" width="180" height="174" rx="30" fill="#FFFFFF" stroke="#D6E6DE" stroke-width="2"/>
    <circle cx="365" cy="165" r="56" fill="#EEF7F2" stroke="#67AD8D" stroke-width="2"/>
    <path d="M331 135h68l-25 31v31l-18 9v-40z" fill="#DDEFE6" stroke="#3C8466" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="343" cy="148" r="5" fill="#55A27F"/>
    <circle cx="365" cy="148" r="5" fill="#75B79A"/>
    <circle cx="387" cy="148" r="5" fill="#CFA43B"/>
    <g class="scan"><rect x="326" y="126" width="18" height="78" rx="9" fill="#A9D2BE"/></g>
  </g>

  <!-- stage 3: feature engineering -->
  <g class="stage s3" filter="url(#shadow)">
    <rect x="505" y="78" width="180" height="174" rx="30" fill="#FFFFFF" stroke="#D6E6DE" stroke-width="2"/>
    <circle cx="595" cy="165" r="56" fill="#EEF7F2" stroke="#67AD8D" stroke-width="2"/>
    <g stroke="#4A9071" stroke-width="2" fill="none" opacity=".85">
      <path d="M568 142l27 23 28-22M568 188l27-23 28 24M568 142v46M623 143v46"/>
    </g>
    <circle cx="568" cy="142" r="8" fill="#4F9878"/>
    <circle cx="568" cy="188" r="8" fill="#6BAF90"/>
    <circle class="pulse" cx="595" cy="165" r="12" fill="url(#green)"/>
    <circle cx="623" cy="143" r="8" fill="#68AA8B"/>
    <circle class="pulse2" cx="623" cy="189" r="8" fill="#D0A238"/>
    <path d="M595 126v18M586 135h18" stroke="#B5841E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- stage 4: hybrid modeling -->
  <g class="stage s4" filter="url(#shadow)">
    <rect x="735" y="78" width="180" height="174" rx="30" fill="#FFFFFF" stroke="#D6E6DE" stroke-width="2"/>
    <circle cx="825" cy="165" r="56" fill="#EEF7F2" stroke="#67AD8D" stroke-width="2"/>
    <g stroke="#317A5B" stroke-width="2" fill="none">
      <path d="M799 128v22M799 150l-22 19M799 150l22 19"/>
    </g>
    <circle cx="799" cy="128" r="9" fill="#286E53"/>
    <circle cx="777" cy="169" r="7" fill="#5AA485"/>
    <circle class="pulse" cx="821" cy="169" r="7" fill="#4A9374"/>
    <g stroke="#6BAE8F" stroke-width="1.8">
      <path d="M837 190l29-22M837 168l29 22M851 157l15 11"/>
    </g>
    <circle cx="837" cy="168" r="6" fill="#71AF93"/>
    <circle cx="837" cy="190" r="6" fill="#5B9F80"/>
    <circle cx="866" cy="168" r="6" fill="#C99B2C"/>
    <circle cx="866" cy="190" r="6" fill="#6BAC8E"/>
    <g class="spin" opacity=".4"><ellipse cx="825" cy="165" rx="47" ry="20" fill="none" stroke="#C99B2C" stroke-width="1.5" stroke-dasharray="6 8"/></g>
  </g>

  <!-- stage 5: validation/final selection -->
  <g class="stage s5" filter="url(#shadow)">
    <rect x="965" y="78" width="190" height="174" rx="30" fill="#FFFFFF" stroke="#E3CF87" stroke-width="2.5"/>
    <circle cx="1060" cy="165" r="58" fill="#FBF4DA" stroke="#D1A63A" stroke-width="2.5"/>
    <path d="M1029 181l20-20 16 13 28-34" fill="none" stroke="#3B8062" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1029" cy="181" r="5" fill="#5CA184"/>
    <circle cx="1049" cy="161" r="5" fill="#5CA184"/>
    <circle cx="1065" cy="174" r="5" fill="#5CA184"/>
    <circle cx="1093" cy="140" r="6" fill="#D0A238" filter="url(#glow)"/>
    <path class="check" d="M1035 207l15 14 34-38" fill="none" stroke="#B98520" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="1094" cy="139" r="8" fill="url(#gold)" opacity=".55"/>
  </g>

  <!-- moving packets on track -->
  <circle r="7" fill="#3E8969" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M112 165 H1088"/>
  </circle>
  <circle r="4" fill="#E0B64D">
    <animateMotion dur="8s" begin="-3.2s" repeatCount="indefinite" path="M112 165 H1088"/>
  </circle>

  <!-- stage markers -->
  <g fill="#FFFFFF" stroke-width="3">
    <circle cx="135" cy="280" r="10" stroke="#5EA486"/>
    <circle cx="365" cy="280" r="10" stroke="#5EA486"/>
    <circle cx="595" cy="280" r="10" stroke="#5EA486"/>
    <circle cx="825" cy="280" r="10" stroke="#5EA486"/>
    <circle cx="1060" cy="280" r="11" stroke="#C8982B"/>
  </g>
  <path d="M135 280 H1060" stroke="#DCE7E1" stroke-width="2" stroke-linecap="round"/>
</svg>