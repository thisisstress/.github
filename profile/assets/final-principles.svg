<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Final research principles animation</title>
  <desc id="desc">Text-free animated four-part diagram representing train-only preprocessing, leakage prevention, reproducible configuration, and evidence-based final model selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="0.55" stop-color="#F1F7F4"/>
      <stop offset="1" stop-color="#FBF7EA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63B18E"/>
      <stop offset="1" stop-color="#174D3B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2D471"/>
      <stop offset="1" stop-color="#AF7513"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA687"/>
      <stop offset="0.68" stop-color="#3D8264"/>
      <stop offset="1" stop-color="#D3A43A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123F33" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card{transform-box:fill-box;transform-origin:center;animation:lift 9.6s ease-in-out infinite}
      .c2{animation-delay:1.8s}.c3{animation-delay:3.6s}.c4{animation-delay:5.4s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 1.2s}
      .dash{stroke-dasharray:10 11;animation:dash 7s linear infinite}
      .lock{transform-box:fill-box;transform-origin:center;animation:lock 4.8s ease-in-out infinite}
      .check{stroke-dasharray:64;stroke-dashoffset:64;animation:check 5.6s ease-in-out infinite}
      .scan{animation:scan 5.2s ease-in-out infinite}
      @keyframes lift{0%,16%,100%{transform:translateY(0)}8%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-210}}
      @keyframes lock{0%,100%{transform:translateY(0)}45%{transform:translateY(-4px)}60%{transform:translateY(0)}}
      @keyframes check{0%,30%{stroke-dashoffset:64}58%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
      @keyframes scan{0%,100%{opacity:.05;transform:translateX(-55px)}48%{opacity:.38}64%{opacity:0;transform:translateX(112px)}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="335" r="155" fill="#B6E0CD" opacity=".13"/>
  <circle cx="1110" cy="10" r="180" fill="#F0DB93" opacity=".14"/>

  <!-- protected evidence rail -->
  <path d="M95 286 H1105" stroke="#D8E5DE" stroke-width="6" stroke-linecap="round"/>
  <path d="M95 286 H1105" stroke="url(#rail)" stroke-width="3.5" stroke-linecap="round" class="dash"/>
  <circle r="6" fill="#D2A238" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M95 286 H1105"/>
  </circle>

  <!-- 1 train-only -->
  <g class="card" filter="url(#shadow)">
    <rect x="42" y="58" width="250" height="198" rx="30" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <circle cx="167" cy="154" r="65" fill="#EDF7F2" stroke="#63AA8A" stroke-width="2"/>
    <path d="M123 123h88l-31 39v39l-24 12v-51z" fill="#DCEEE5" stroke="#3F8668" stroke-width="2.7" stroke-linejoin="round"/>
    <circle cx="140" cy="140" r="6" fill="#4C9675"/>
    <circle cx="167" cy="140" r="6" fill="#69AD8E"/>
    <circle cx="194" cy="140" r="6" fill="#D0A13A"/>
    <g class="scan"><rect x="116" y="111" width="20" height="96" rx="10" fill="#A7D2BD"/></g>
    <circle class="pulse" cx="218" cy="93" r="8" fill="#4F9878"/>
  </g>

  <!-- 2 leakage barrier -->
  <g class="card c2" filter="url(#shadow)">
    <rect x="330" y="58" width="250" height="198" rx="30" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <circle cx="455" cy="154" r="65" fill="#EEF7F3" stroke="#67AC8D" stroke-width="2"/>
    <path d="M455 103l45 17v34c0 31-19 49-45 62-26-13-45-31-45-62v-34z" fill="#DDEFE6" stroke="#397F61" stroke-width="2.8"/>
    <path d="M434 156l14 14 29-34" fill="none" stroke="#33785B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="check"/>
    <path d="M365 126c15 0 24 11 31 24M544 126c-15 0-24 11-31 24" fill="none" stroke="#83BAA1" stroke-width="2.2" stroke-dasharray="6 8"/>
    <circle cx="370" cy="126" r="7" fill="#6CAA8F" opacity=".7"/>
    <circle cx="540" cy="126" r="7" fill="#D4A63A" opacity=".55"/>
  </g>

  <!-- 3 reproducibility -->
  <g class="card c3" filter="url(#shadow)">
    <rect x="618" y="58" width="250" height="198" rx="30" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <circle cx="743" cy="154" r="65" fill="#EEF7F3" stroke="#67AC8D" stroke-width="2"/>
    <g fill="none" stroke="#3E8264" stroke-width="2.5">
      <circle cx="743" cy="154" r="35"/>
      <path d="M743 111v17M743 180v17M700 154h17M769 154h17M713 124l12 12M761 172l12 12M773 124l-12 12M725 172l-12 12"/>
    </g>
    <circle class="pulse2" cx="743" cy="154" r="16" fill="url(#green)"/>
    <g class="lock">
      <rect x="778" y="188" width="39" height="31" rx="8" fill="#F6EDCF" stroke="#C59729" stroke-width="2"/>
      <path d="M786 188v-8c0-9 6-15 12-15s12 6 12 15v8" fill="none" stroke="#A97816" stroke-width="2.5"/>
      <circle cx="798" cy="203" r="4" fill="#A97816"/>
    </g>
  </g>

  <!-- 4 evidence selection -->
  <g class="card c4" filter="url(#shadow)">
    <rect x="906" y="58" width="252" height="198" rx="30" fill="#FFFFFF" stroke="#E2CE87" stroke-width="2.5"/>
    <circle cx="1032" cy="154" r="67" fill="#FBF4DB" stroke="#D2A43A" stroke-width="2.4"/>
    <path d="M986 181l24-28 20 16 36-48" fill="none" stroke="#397F61" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="986" cy="181" r="6" fill="#5FA487"/>
    <circle cx="1010" cy="153" r="6" fill="#5FA487"/>
    <circle cx="1030" cy="169" r="6" fill="#5FA487"/>
    <circle class="pulse" cx="1066" cy="121" r="8" fill="url(#gold)" filter="url(#glow)"/>
    <path class="check" d="M1007 205l16 15 35-39" fill="none" stroke="#B7831C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="1032" cy="154" rx="86" ry="31" fill="none" stroke="#D1AC4B" stroke-width="1.6" opacity=".4" class="dash"/>
  </g>

  <!-- stage anchors -->
  <g fill="#FFFFFF" stroke-width="3">
    <circle cx="167" cy="286" r="10" stroke="#5DA486"/>
    <circle cx="455" cy="286" r="10" stroke="#5DA486"/>
    <circle cx="743" cy="286" r="10" stroke="#5DA486"/>
    <circle cx="1032" cy="286" r="11" stroke="#C99A2D"/>
  </g>
</svg>