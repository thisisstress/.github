<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Final hybrid architecture animation</title>
  <desc id="desc">Text-free animated diagram showing health features flowing into an ExtraTrees branch and a Pair-Neighbor branch, blending into a final prediction with a near-duplicate override.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="0.52" stop-color="#F1F7F4"/>
      <stop offset="1" stop-color="#FBF7EA"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F7A5A"/>
      <stop offset="1" stop-color="#0B3D30"/>
    </linearGradient>
    <linearGradient id="pairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA77D"/>
      <stop offset="1" stop-color="#275F49"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B77D15"/>
      <stop offset="0.5" stop-color="#E1B84D"/>
      <stop offset="1" stop-color="#F4D77B"/>
    </linearGradient>
    <radialGradient id="finalGlow">
      <stop offset="0" stop-color="#F9E6A0" stop-opacity=".95"/>
      <stop offset="0.45" stop-color="#E4B94C" stop-opacity=".38"/>
      <stop offset="1" stop-color="#E4B94C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#183E31" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow{stroke-dasharray:14 12;animation:flow 7s linear infinite}
      .flow2{stroke-dasharray:10 14;animation:flow 8.5s linear infinite reverse}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite 1.2s}
      .float{transform-box:fill-box;transform-origin:center;animation:float 5.8s ease-in-out infinite}
      .float2{transform-box:fill-box;transform-origin:center;animation:float2 7.2s ease-in-out infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
      .orbit2{transform-box:fill-box;transform-origin:center;animation:spinReverse 27s linear infinite}
      .scan{animation:scan 5.5s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-260}}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.12);opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-5px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinReverse{to{transform:rotate(-360deg)}}
      @keyframes scan{0%,100%{opacity:.12;transform:translateX(-90px)}48%{opacity:.55}60%{opacity:0;transform:translateX(510px)}}
    </style>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="190" fill="#F8E8B0" opacity=".17"/>
  <circle cx="170" cy="350" r="210" fill="#B9E1CF" opacity=".16"/>

  <!-- input health signals -->
  <g filter="url(#shadow)">
    <rect x="44" y="72" width="190" height="286" rx="28" fill="#FFFFFF" stroke="#D7E6DF" stroke-width="2"/>
  </g>
  <g class="float">
    <circle cx="103" cy="129" r="25" fill="#E8F5EF" stroke="#5DA987" stroke-width="2"/>
    <path d="M91 129h24M103 117v24" stroke="#2D7358" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="float2">
    <circle cx="172" cy="177" r="23" fill="#EDF7F2" stroke="#75B698" stroke-width="2"/>
    <path d="M160 181c8-18 18-18 24 0M161 172h22" fill="none" stroke="#3F8064" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="float">
    <circle cx="103" cy="238" r="25" fill="#F7F2DF" stroke="#D5B254" stroke-width="2"/>
    <path d="M92 244c5-18 19-18 23 0M94 229h18" fill="none" stroke="#9A741D" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="float2">
    <circle cx="171" cy="294" r="23" fill="#EEF6F2" stroke="#6EAC8E" stroke-width="2"/>
    <path d="M162 294h18M171 285v18" stroke="#397A5E" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <path d="M124 152 C136 161 147 165 155 169" fill="none" stroke="#B5CFC2" stroke-width="2"/>
  <path d="M151 197 C137 208 122 217 114 220" fill="none" stroke="#C8D9D0" stroke-width="2"/>
  <path d="M125 257 C140 268 149 277 155 283" fill="none" stroke="#C4D8CE" stroke-width="2"/>

  <!-- flows to branches -->
  <path d="M234 162 C285 162 288 134 342 134" fill="none" stroke="#4E9A78" stroke-width="4" class="flow"/>
  <path d="M234 276 C285 276 288 298 342 298" fill="none" stroke="#76B698" stroke-width="4" class="flow2"/>

  <!-- tree branch card -->
  <g filter="url(#shadow)">
    <rect x="342" y="62" width="264" height="162" rx="28" fill="#FFFFFF" stroke="#CAE0D5" stroke-width="2"/>
  </g>
  <g opacity=".88" stroke="#2B7358" stroke-width="2.2" fill="none">
    <path d="M474 91v26M474 117l-48 31M474 117l48 31M426 148l-27 29M426 148l25 29M522 148l-25 29M522 148l27 29"/>
  </g>
  <g>
    <circle class="pulse" cx="474" cy="91" r="12" fill="url(#treeGrad)"/>
    <circle cx="426" cy="148" r="10" fill="#2F7C5E"/>
    <circle class="pulse2" cx="522" cy="148" r="10" fill="#397F63"/>
    <circle cx="399" cy="177" r="7" fill="#6DAA8E"/>
    <circle cx="451" cy="177" r="7" fill="#5C9D80"/>
    <circle cx="497" cy="177" r="7" fill="#71B094"/>
    <circle cx="549" cy="177" r="7" fill="#57977A"/>
  </g>
  <g class="orbit" opacity=".34">
    <ellipse cx="474" cy="144" rx="94" ry="58" fill="none" stroke="#68AA8A" stroke-width="1.5" stroke-dasharray="8 10"/>
  </g>

  <!-- pair branch card -->
  <g filter="url(#shadow)">
    <rect x="342" y="244" width="264" height="124" rx="28" fill="#FFFFFF" stroke="#CEE2D8" stroke-width="2"/>
  </g>
  <g stroke="#4C9675" stroke-width="1.7" opacity=".7">
    <path d="M390 282l43 47M390 329l43-47M463 282l43 47M463 329l43-47M536 282l26 24M536 329l26-23"/>
  </g>
  <g fill="url(#pairGrad)">
    <circle class="pulse2" cx="390" cy="282" r="8"/><circle cx="390" cy="329" r="8"/>
    <circle cx="433" cy="282" r="8"/><circle class="pulse" cx="433" cy="329" r="8"/>
    <circle cx="463" cy="282" r="8"/><circle cx="463" cy="329" r="8"/>
    <circle class="pulse2" cx="506" cy="282" r="8"/><circle cx="506" cy="329" r="8"/>
    <circle cx="536" cy="282" r="8"/><circle class="pulse" cx="536" cy="329" r="8"/>
    <circle cx="562" cy="306" r="11" fill="#D7A72F" filter="url(#glow)"/>
  </g>

  <!-- branch output channels -->
  <path d="M606 142 C671 142 682 174 738 192" fill="none" stroke="#2E7C5D" stroke-width="6" stroke-linecap="round" class="flow"/>
  <path d="M606 306 C670 306 683 254 738 232" fill="none" stroke="#5DA786" stroke-width="4" stroke-linecap="round" class="flow2"/>

  <!-- blend core -->
  <g filter="url(#shadow)">
    <circle cx="804" cy="212" r="70" fill="#FFFFFF" stroke="#E0C46E" stroke-width="3"/>
    <circle cx="804" cy="212" r="51" fill="#FAF3DA" stroke="#D4A83B" stroke-width="2"/>
  </g>
  <g class="orbit2" opacity=".7">
    <ellipse cx="804" cy="212" rx="88" ry="30" fill="none" stroke="#CFAB47" stroke-width="2" stroke-dasharray="9 9"/>
  </g>
  <circle class="pulse" cx="804" cy="212" r="18" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="775" cy="191" r="6" fill="#2D765A"/>
  <circle cx="832" cy="233" r="5" fill="#6DAA8A"/>

  <!-- override gate -->
  <path d="M874 212 C910 212 932 212 966 212" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="966" y="155" width="96" height="114" rx="30" fill="#FFFFFF" stroke="#E4CD82" stroke-width="2"/>
  </g>
  <circle cx="1014" cy="190" r="17" fill="#E8F4EE" stroke="#68A989" stroke-width="2"/>
  <circle cx="1008" cy="190" r="4" fill="#347B5E"/><circle cx="1020" cy="190" r="4" fill="#347B5E"/>
  <path d="M1014 207v27" stroke="#C89C31" stroke-width="3" stroke-linecap="round"/>
  <path d="M1003 226l11 11 11-11" fill="none" stroke="#C89C31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="scan"><rect x="974" y="161" width="18" height="102" rx="9" fill="#F6D975"/></g>

  <!-- final prediction -->
  <path d="M1062 212h52" stroke="#B98520" stroke-width="5" stroke-linecap="round" class="flow2"/>
  <circle cx="1148" cy="212" r="52" fill="url(#finalGlow)"/>
  <circle class="pulse" cx="1148" cy="212" r="25" fill="url(#finalOrb)" stroke="#A36F11" stroke-width="2" filter="url(#glow)"/>
  <circle cx="1148" cy="212" r="9" fill="#FFF5C7" opacity=".95"/>

  <!-- subtle baseline -->
  <path d="M58 395 H1142" stroke="#D6E2DC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="234" cy="395" r="4" fill="#5AA17F"/>
  <circle cx="606" cy="395" r="4" fill="#5AA17F"/>
  <circle cx="804" cy="395" r="5" fill="#D2A238"/>
  <circle cx="1014" cy="395" r="4" fill="#C89C31"/>
  <circle cx="1148" cy="395" r="5" fill="#B98520"/>
</svg>