  <g><rect width="280" height="330" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8"/><circle cx="42" cy="44" r="22" fill="#e8bd58"/><text x="42" y="51" text-anchor="middle" font-size="16" font-weight="850" fill="#143a2c">01</text><text x="78" y="50" font-size="23" font-weight="850" fill="#f5efdf">Input features</text><g font-size="16" fill="#dbe7d2"><text x="34" y="104">• BMI</text><text x="34" y="140">• pulse pressure</text><text x="34" y="176">• mean arterial pressure</text><text x="34" y="212">• cholesterol / glucose ratio</text><text x="34" y="248">• missingness pattern</text></g><rect x="24" y="276" width="232" height="32" rx="12" fill="#0d3c2f" stroke="#5b9e73"/><text x="140" y="297" text-anchor="middle" font-size="14" fill="#cde0bc">Tabular health features</text></g>
