<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">Final model architecture</title>
<desc id="desc">Input features flow into ExtraTrees global reasoning and Pair-Neighbor local reasoning, then a 76 to 24 weighted blend produces the final stress score prediction.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06291f"/><stop offset=".55" stop-color="#0a392c"/><stop offset="1" stop-color="#07261e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7ebc2"/><stop offset=".5" stop-color="#e8bd58"/><stop offset="1" stop-color="#b77a20"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00150f" flood-opacity=".34"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e5b94d"/></marker>
</defs>
<rect width="1600" height="650" rx="30" fill="url(#bg)"/>
<rect x="22" y="22" width="1556" height="606" rx="27" fill="none" stroke="#9bc69f" stroke-opacity=".55" stroke-width="2"/>
<circle cx="1480" cy="90" r="220" fill="#dbad43" opacity=".05"/>
<g font-family="Inter, Arial, sans-serif">
 <text x="70" y="80" font-size="17" font-weight="700" letter-spacing="5" fill="#b8d7ad">FINAL ARCHITECTURE</text>
 <line x1="338" y1="75" x2="414" y2="75" stroke="#e7bd58" stroke-width="3"/>
 <text x="70" y="145" font-size="52" font-weight="850" fill="#f5efd9">Global + Local Reasoning</text>
 <text x="70" y="182" font-size="21" fill="#a9caa8">Two complementary views, combined into one final stress-score prediction.</text>
 <text x="1515" y="80" text-anchor="end" font-size="14" font-weight="700" letter-spacing="3" fill="#d6c17d">SAME DATA · DEEPER INSIGHTS</text>
</g>
<g fill="none" stroke="#e5b94d" stroke-width="3" marker-end="url(#arrow)" opacity=".9"><path d="M330 390H375"/><path d="M680 390H725"/><path d="M1030 390H1075"/><path d="M1330 390H1375"/></g>
<g transform="translate(55 235)" font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
 <g><rect width="275" height="330" rx="25" fill="#0b3328" stroke="#79af86" stroke-width="1.7"/><text x="28" y="48" font-size="24" font-weight="800" fill="#f4efd9">Input features</text><line x1="28" y1="70" x2="247" y2="70" stroke="#527662"/><g font-size="17" fill="#dce4cf"><text x="36" y="116">• BMI</text><text x="36" y="155">• mean_working</text><text x="36" y="194">• pulse pressure</text><text x="36" y="233">• cholesterol / HDL</text><text x="36" y="272">• missingness pattern</text></g><text x="36" y="307" font-size="14" fill="#d6c78f">16 project features</text></g>
 <g transform="translate(320 0)"><rect width="305" height="330" rx="25" fill="#0b3328" stroke="#d0a746" stroke-width="1.9"/><text x="28" y="48" font-size="24" font-weight="800" fill="#f4efd9">Global reasoning</text><text x="28" y="79" font-size="17" font-weight="700" fill="#e8bd58">ExtraTrees</text><g transform="translate(75 112)" stroke="#d8b657" stroke-width="3" fill="none"><path d="M78 115V68M78 72L38 36M78 72L118 36M38 36L16 12M38 36L53 8M118 36L102 9M118 36L140 14"/><g fill="#78b98b" stroke="#cae1bc" stroke-width="1.5"><circle cx="78" cy="115" r="10"/><circle cx="38" cy="36" r="7"/><circle cx="118" cy="36" r="7"/><circle cx="16" cy="12" r="5"/><circle cx="53" cy="8" r="5"/><circle cx="102" cy="9" r="5"/><circle cx="140" cy="14" r="5"/></g></g><text x="28" y="292" font-size="15" fill="#b4d0ae">Captures broad, stable patterns</text><text x="28" y="318" font-size="14" fill="#d6c78f">1,200 trees · Q54</text></g>
 <g transform="translate(670 0)"><rect width="305" height="330" rx="25" fill="#0b3328" stroke="#79af86" stroke-width="1.7"/><text x="28" y="48" font-size="24" font-weight="800" fill="#f4efd9">Local reasoning</text><text x="28" y="79" font-size="17" font-weight="700" fill="#9bcfa7">Pair-Neighbor</text><g transform="translate(46 122)" stroke="#91c7a0" stroke-width="2.4" fill="#77ba8b"><path d="M0 30L38 6L58 42L0 30M92 36L126 10L157 41L92 36M45 106L80 128L106 95L45 106"/><circle cx="0" cy="30" r="6"/><circle cx="38" cy="6" r="6"/><circle cx="58" cy="42" r="6"/><circle cx="92" cy="36" r="6"/><circle cx="126" cy="10" r="6"/><circle cx="157" cy="41" r="6"/><circle cx="45" cy="106" r="6"/><circle cx="80" cy="128" r="6"/><circle cx="106" cy="95" r="6"/></g><text x="28" y="292" font-size="15" fill="#b4d0ae">Learns from similar local samples</text><text x="28" y="318" font-size="14" fill="#d6c78f">28 pair spaces · Q48</text></g>
 <g transform="translate(1020 0)"><rect width="255" height="330" rx="25" fill="#0b3328" stroke="#d0a746" stroke-width="1.9"/><text x="28" y="48" font-size="24" font-weight="800" fill="#f4efd9">Weighted blend</text><circle cx="128" cy="151" r="68" fill="none" stroke="#e3b84f" stroke-width="18" stroke-dasharray="323 104" transform="rotate(-90 128 151)"/><circle cx="128" cy="151" r="68" fill="none" stroke="#78ba8c" stroke-width="18" stroke-dasharray="104 323" stroke-dashoffset="-323" transform="rotate(-90 128 151)"/><text x="128" y="160" text-anchor="middle" font-size="27" font-weight="850" fill="#f4efd9">76 / 24</text><text x="28" y="272" font-size="16" fill="#f0d078">ExtraTrees 76%</text><text x="28" y="302" font-size="16" fill="#b8d7ad">Pair-Neighbor 24%</text></g>
 <g transform="translate(1320 0)"><rect width="225" height="330" rx="25" fill="#0b3328" stroke="#d0a746" stroke-width="1.9"/><text x="28" y="48" font-size="24" font-weight="800" fill="#f4efd9">Final score</text><circle cx="113" cy="152" r="73" fill="#d9a83f" opacity=".12"/><circle cx="113" cy="152" r="44" fill="none" stroke="#dfb34d" stroke-width="2"/><circle cx="113" cy="152" r="20" fill="#e8bd56"/><circle cx="113" cy="152" r="8" fill="#fff0b4"/><text x="113" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#f0d078">stress_score</text><text x="113" y="294" text-anchor="middle" font-size="14" fill="#b8d7ad">one final prediction</text></g>
</g>
<line x1="58" y1="600" x2="1542" y2="600" stroke="#79af86" stroke-opacity=".55"/>
<text x="78" y="628" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#d5c17e">TABULAR REGRESSION · MAE · REPRODUCIBLE FINAL BLEND</text>
</svg>