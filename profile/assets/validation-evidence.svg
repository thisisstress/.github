<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc"><title id="title">Validation and evidence</title><desc id="desc">Aligned validation dashboard showing data, final MAE, validation contract and interpretation boundaries.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06271f"/><stop offset=".56" stop-color="#0a382b"/><stop offset="1" stop-color="#071f19"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6ead0"/><stop offset=".5" stop-color="#e7bd58"/><stop offset="1" stop-color="#bd7c22"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c3a2d"/><stop offset="1" stop-color="#082b22"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6bb589" stop-opacity="0"/><stop offset=".58" stop-color="#9ed7ae" stop-opacity=".18"/><stop offset="1" stop-color="#e9bd58" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#e8bd58" stop-opacity=".34"/><stop offset="1" stop-color="#e8bd58" stop-opacity="0"/></radialGradient>
    <radialGradient id="ambientEmerald"><stop stop-color="#75c796" stop-opacity=".20"/><stop offset="1" stop-color="#75c796" stop-opacity="0"/></radialGradient>
    <radialGradient id="ambientGold"><stop stop-color="#e7bd58" stop-opacity=".22"/><stop offset="1" stop-color="#e7bd58" stop-opacity="0"/></radialGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00150f" flood-opacity=".22"/>
    </filter>
    <filter id="microGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs><rect width="1600" height="650" rx="28" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="602" rx="24" fill="none" stroke="#79b88d" stroke-opacity=".76" stroke-width="2"/><rect x="36" y="36" width="1528" height="578" rx="20" fill="none" stroke="#83c69a" stroke-opacity=".24"/><ellipse cx="170" cy="92" rx="300" ry="190" fill="url(#ambientEmerald)" opacity=".38">
      <animate attributeName="opacity" values=".28;.42;.28" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1430" cy="92" rx="310" ry="185" fill="url(#ambientGold)" opacity=".40">
      <animate attributeName="opacity" values=".28;.46;.28" dur="15s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse><path d="M930 8 L1570 8 L1570 215 C1390 157 1165 129 930 8Z" fill="url(#beam)" opacity=".50">
      <animate attributeName="opacity" values=".34;.58;.34" dur="12s" repeatCount="indefinite"/>
    </path><g id="ambient-specks" fill="#e7bd58" filter="url(#microGlow)">
      <circle cx="1188" cy="104" r="2.4" opacity=".38"><animate attributeName="opacity" values=".18;.58;.18" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="1374" cy="86" r="2.1" opacity=".32"><animate attributeName="opacity" values=".15;.48;.15" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="1494" cy="178" r="1.9" opacity=".30"><animate attributeName="opacity" values=".12;.44;.12" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    </g><g font-family="Inter,Arial,sans-serif"><text x="72" y="78" font-size="16" font-weight="700" letter-spacing="5" fill="#b5d8ae">VALIDATION &amp; EVIDENCE</text><circle cx="362" cy="72" r="5" fill="#edc65d" filter="url(#microGlow)">
      <animate attributeName="opacity" values=".65;1;.65" dur="8s" repeatCount="indefinite"/>
    </circle><line x1="378" y1="72" x2="630" y2="72" stroke="#d4aa45" stroke-opacity=".55"/><text x="72" y="145" font-size="50" font-weight="850" fill="#f5efdf">Trustworthy progress,</text><text x="650" y="145" font-size="50" font-weight="850" fill="url(#gold)">careful boundaries</text><text x="72" y="188" font-size="21" fill="#afd0ae">Performance is only meaningful within the validation contract it comes from.</text><text x="1528" y="68" text-anchor="end" font-size="14" font-weight="700" letter-spacing="4" fill="#b5d8ae">DATA · MODELS · INSIGHTS</text></g><g fill="none" stroke-linecap="round"><path d="M1000 170 C1132 126 1248 183 1366 143 C1438 120 1498 121 1540 109" stroke="#64b58a" stroke-width="2.4" opacity=".62"/><path d="M1000 188 C1140 150 1260 203 1380 158 C1450 132 1502 133 1540 118" stroke="#e1b54d" stroke-width="2.1" opacity=".60"/></g><g transform="translate(1510 108)" filter="url(#microGlow)"><circle r="40" fill="url(#halo)"/><circle r="27" fill="none" stroke="#dfb44c" stroke-opacity=".55"/><circle r="11" fill="#e8bd56"><animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/></circle><circle r="4" fill="#fff1b6"/></g>
<g transform="translate(56 238)" font-family="Inter,Arial,sans-serif">
<g><rect width="360" height="330" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><circle cx="44" cy="46" r="24" fill="#e8bd58"/><g transform="translate(31 32)" fill="none" stroke="#143a2c" stroke-width="2.4"><ellipse cx="13" cy="7" rx="11" ry="4"/><path d="M2 7v22c0 4 5 6 11 6s11-2 11-6V7M2 18c0 4 5 6 11 6s11-2 11-6"/></g><text x="88" y="48" font-size="24" font-weight="850" fill="#f5efdf">Dataset</text><text x="88" y="76" font-size="15" fill="#afd0ae">Training data and target</text><line x1="24" y1="98" x2="336" y2="98" stroke="#527662"/><text x="28" y="140" font-size="16" fill="#dbe7d2">Training rows</text><text x="330" y="140" text-anchor="end" font-size="30" font-weight="850" fill="#f0ca69">3,000</text><line x1="24" y1="154" x2="336" y2="154" stroke="#3d6753"/><text x="28" y="194" font-size="16" fill="#dbe7d2">Target</text><text x="330" y="194" text-anchor="end" font-size="20" font-weight="750" fill="#f5efdf">stress_score</text><line x1="24" y1="208" x2="336" y2="208" stroke="#3d6753"/><text x="28" y="248" font-size="16" fill="#dbe7d2">Metric</text><text x="330" y="248" text-anchor="end" font-size="20" font-weight="850" fill="#f5efdf">MAE</text><rect x="24" y="278" width="312" height="30" rx="11" fill="#0d3c2f" stroke="#5b9e73"/><text x="180" y="298" text-anchor="middle" font-size="14" fill="#cde0bc">Same data, clearer questions.</text></g>
<g transform="translate(376)"><rect width="360" height="330" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><circle cx="44" cy="46" r="24" fill="#8fcfa0"/><g transform="translate(30 30)" fill="#143a2c"><rect x="0" y="16" width="6" height="15" rx="2"/><rect x="10" y="10" width="6" height="21" rx="2"/><rect x="20" y="3" width="6" height="28" rx="2"/></g><text x="88" y="48" font-size="24" font-weight="850" fill="#f5efdf">Final performance</text><text x="88" y="76" font-size="15" fill="#afd0ae">Evaluation on held-out data</text><rect x="24" y="118" width="148" height="128" rx="18" fill="#0d3c2f" stroke="#6aa67e"/><text x="42" y="148" font-size="15" fill="#b7d4ae">Public MAE</text><text x="42" y="200" font-size="34" font-weight="850" fill="#f0ca69">0.1267</text><text x="42" y="230" font-size="14" fill="#dce8d2">leaderboard</text><rect x="188" y="118" width="148" height="128" rx="18" fill="#0d3c2f" stroke="#6aa67e"/><text x="206" y="148" font-size="15" fill="#b7d4ae">Private MAE</text><text x="206" y="200" font-size="34" font-weight="850" fill="#f5efdf">0.1473</text><text x="206" y="230" font-size="14" fill="#dce8d2">final evaluation</text><rect x="24" y="278" width="312" height="30" rx="11" fill="#0d3c2f" stroke="#5b9e73"/><text x="180" y="298" text-anchor="middle" font-size="14" fill="#cde0bc">Consistent, reproducible results.</text></g>
<g transform="translate(752)"><rect width="360" height="330" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><circle cx="44" cy="46" r="24" fill="#e8bd58"/><g transform="translate(32 31)" fill="none" stroke="#143a2c" stroke-width="2.6"><path d="M0 0h18l8 8v23H0Z"/><path d="M18 0v8h8M6 16h14M6 22h14"/></g><text x="88" y="48" font-size="24" font-weight="850" fill="#f5efdf">Validation contract</text><text x="88" y="76" font-size="15" fill="#afd0ae">Grouped or contract-aware</text><g font-size="16" fill="#dbe7d2"><circle cx="42" cy="132" r="13" fill="#14683f"/><text x="42" y="138" text-anchor="middle" fill="#f0d078" font-size="18">✓</text><text x="70" y="138">Evaluation follows defined groups</text><circle cx="42" cy="178" r="13" fill="#14683f"/><text x="42" y="184" text-anchor="middle" fill="#f0d078" font-size="18">✓</text><text x="70" y="184">Comparison under the same rules</text><circle cx="42" cy="224" r="13" fill="#14683f"/><text x="42" y="230" text-anchor="middle" fill="#f0d078" font-size="18">✓</text><text x="70" y="219">No direct ranking across</text><text x="70" y="240">incompatible setups</text></g><rect x="24" y="278" width="312" height="30" rx="11" fill="#0d3c2f" stroke="#5b9e73"/><text x="180" y="298" text-anchor="middle" font-size="14" fill="#cde0bc">Fair comparison. Clear boundaries.</text></g>
<g transform="translate(1128)"><rect width="360" height="330" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><circle cx="44" cy="46" r="24" fill="#8fcfa0"/><path d="M34 33 L44 28 L54 33 V45 C54 54 49 60 44 63 C39 60 34 54 34 45Z" fill="#143a2c"/><text x="88" y="48" font-size="21" font-weight="850" fill="#f5efdf">Interpretation boundary</text><text x="88" y="76" font-size="15" fill="#afd0ae">Research use and context</text><g font-size="16" fill="#dbe7d2"><circle cx="42" cy="132" r="13" fill="#14683f"/><text x="42" y="138" text-anchor="middle" fill="#f0d078" font-size="18">✓</text><text x="70" y="138">For research and educational use</text><circle cx="42" cy="178" r="13" fill="#14683f"/><text x="42" y="184" text-anchor="middle" fill="#f0d078" font-size="18">✓</text><text x="70" y="173">Results require contextual</text><text x="70" y="194">interpretation</text><circle cx="42" cy="224" r="13" fill="#14683f"/><text x="42" y="230" text-anchor="middle" fill="#f0d078" font-size="18">✓</text><text x="70" y="230">Not a clinical decision model</text></g><rect x="24" y="278" width="312" height="30" rx="11" fill="#0d3c2f" stroke="#5b9e73"/><text x="180" y="298" text-anchor="middle" font-size="14" fill="#cde0bc">Insight, not a diagnosis.</text></g>
</g><line x1="56" y1="596" x2="1544" y2="596" stroke="#67a77e" stroke-opacity=".5"/><g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3.2"><text x="72" y="622" fill="#a9d7b1">REPRODUCIBLE METHODS · RESPONSIBLE VALIDATION</text><text x="1528" y="622" text-anchor="end" fill="#a9d7b1">PEOPLE · DATA · REAL-WORLD IMPACT</text></g></svg>