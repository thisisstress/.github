<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">THIS IS STRESS validation and evidence</title>
  <desc id="desc">A warm forest-green and gold validation panel showing dataset size, metric, public and private MAE, validation principles, leakage guards, and interpretation boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06271f"/>
      <stop offset=".56" stop-color="#0a382b"/>
      <stop offset="1" stop-color="#08291f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e9bb"/>
      <stop offset=".52" stop-color="#e7bd58"/>
      <stop offset="1" stop-color="#b87a1f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2dfb6"/>
      <stop offset="1" stop-color="#6fb88b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00140f" flood-opacity=".36"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="660" rx="30" fill="url(#bg)"/>
  <circle cx="1425" cy="78" r="220" fill="#dcb04c" opacity=".05"/>
  <circle cx="140" cy="610" r="250" fill="#78b58c" opacity=".06"/>
  <path d="M0 520 C280 470 520 610 780 545 C1030 483 1280 575 1600 485" fill="none" stroke="#8db99c" stroke-opacity=".07" stroke-width="78"/>
  <rect x="22" y="22" width="1556" height="616" rx="28" fill="none" stroke="#9bc69f" stroke-opacity=".55" stroke-width="2"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="82" font-size="18" font-weight="700" letter-spacing="5" fill="#b9d8ad">VALIDATION &amp; EVIDENCE</text>
    <line x1="370" y1="76" x2="445" y2="76" stroke="#e7bd58" stroke-width="3"/>
    <text x="70" y="140" font-size="52" font-weight="800" fill="#f5efd9">Trustworthy progress,</text>
    <text x="546" y="140" font-size="52" font-weight="800" fill="url(#gold)">careful boundaries</text>
    <text x="72" y="178" font-size="22" fill="#a9caa8">Performance is only meaningful when the validation contract is clear.</text>
    <text x="1515" y="80" text-anchor="end" font-size="14" font-weight="700" letter-spacing="3" fill="#d7c58a">REAL DATA · RESPONSIBLE VALIDATION</text>
    <text x="1515" y="108" text-anchor="end" font-size="15" fill="#a9caa8">Not just numbers. Evidence with context.</text>
  </g>

  <!-- botanical accent -->
  <g transform="translate(1360 125)" stroke="#dcb655" stroke-width="2.5" fill="none" opacity=".9">
    <path d="M0 62 C48 42 84 19 122 -5"/>
    <path d="M38 46 C35 24 45 9 61 -1"/>
    <path d="M76 24 C87 10 101 2 118 1"/>
    <ellipse cx="50" cy="20" rx="8" ry="15" transform="rotate(38 50 20)" fill="#7fbd90" fill-opacity=".55"/>
    <ellipse cx="96" cy="5" rx="7" ry="14" transform="rotate(48 96 5)" fill="#dcb655" fill-opacity=".65"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <!-- Dataset -->
    <g transform="translate(55 225)">
      <rect width="340" height="300" rx="26" fill="#0b3328" fill-opacity=".97" stroke="#80b78f" stroke-width="1.8"/>
      <circle cx="48" cy="50" r="25" fill="#e9c15e"/>
      <g transform="translate(33 34)" fill="none" stroke="#173c2e" stroke-width="3">
        <ellipse cx="15" cy="6" rx="13" ry="5"/>
        <path d="M2 6v26c0 4 6 7 13 7s13-3 13-7V6M2 18c0 4 6 7 13 7s13-3 13-7"/>
      </g>
      <text x="90" y="48" font-size="25" font-weight="800" fill="#f4efd9">Dataset</text>
      <text x="90" y="76" font-size="15" font-weight="700" fill="#b8d8ad">Training evidence base</text>

      <line x1="28" y1="105" x2="312" y2="105" stroke="#547965"/>
      <text x="34" y="143" font-size="16" fill="#a9caa8">Training rows</text>
      <text x="305" y="143" text-anchor="end" font-size="30" font-weight="800" fill="#f4efd9">3,000</text>
      <text x="34" y="185" font-size="16" fill="#a9caa8">Target</text>
      <text x="305" y="185" text-anchor="end" font-size="20" font-weight="800" fill="#e7d99f">stress_score</text>
      <text x="34" y="225" font-size="16" fill="#a9caa8">Metric</text>
      <text x="305" y="225" text-anchor="end" font-size="20" font-weight="800" fill="#e7d99f">MAE ↓</text>
      <text x="34" y="266" font-size="14" fill="#d6c78f">Lower is better · target range 0–1</text>
    </g>

    <!-- Performance -->
    <g transform="translate(415 225)">
      <rect width="350" height="300" rx="26" fill="#0b3328" fill-opacity=".97" stroke="#d2aa46" stroke-width="2"/>
      <circle cx="49" cy="50" r="25" fill="#79bd8f"/>
      <path d="M38 54 L46 62 L61 42" fill="none" stroke="#173c2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="48" font-size="25" font-weight="800" fill="#f4efd9">Final performance</text>
      <text x="92" y="76" font-size="15" font-weight="700" fill="#b8d8ad">BS 8/6 adopted model</text>
      <line x1="28" y1="105" x2="322" y2="105" stroke="#547965"/>

      <rect x="28" y="130" width="138" height="105" rx="18" fill="#133e31" stroke="#6fa683"/>
      <text x="97" y="158" text-anchor="middle" font-size="14" fill="#b9d8ad">Public MAE</text>
      <text x="97" y="203" text-anchor="middle" font-size="31" font-weight="800" fill="#f0d17a">0.1267</text>

      <rect x="184" y="130" width="138" height="105" rx="18" fill="#133e31" stroke="#6fa683"/>
      <text x="253" y="158" text-anchor="middle" font-size="14" fill="#b9d8ad">Private MAE</text>
      <text x="253" y="203" text-anchor="middle" font-size="31" font-weight="800" fill="#f4efd9">0.1473</text>

      <text x="175" y="269" text-anchor="middle" font-size="15" fill="#d8c88f">ExtraTrees 76% + Pair-Neighbor 24%</text>
    </g>

    <!-- Validation strategy -->
    <g transform="translate(785 225)">
      <rect width="365" height="300" rx="26" fill="#0b3328" fill-opacity=".97" stroke="#80b78f" stroke-width="1.8"/>
      <circle cx="50" cy="50" r="25" fill="#e9c15e"/>
      <path d="M38 47 L50 36 L62 47 V61 C62 71 55 78 50 81 C45 78 38 71 38 61 Z" fill="none" stroke="#173c2e" stroke-width="3"/>
      <text x="94" y="48" font-size="25" font-weight="800" fill="#f4efd9">Validation contract</text>
      <text x="94" y="76" font-size="15" font-weight="700" fill="#b8d8ad">Prevent leakage, compare carefully</text>
      <line x1="28" y1="105" x2="337" y2="105" stroke="#547965"/>

      <g font-size="16" fill="#e7e0c9">
        <text x="36" y="144">✓ Group-aware evaluation</text>
        <text x="36" y="181">✓ Exact / near-duplicate audit</text>
        <text x="36" y="218">✓ Single champion first, then blend</text>
        <text x="36" y="255">✓ No direct ranking across different contracts</text>
      </g>
      <text x="36" y="284" font-size="14" fill="#d6c78f">Raw scores + reference model first.</text>
    </g>

    <!-- Boundaries -->
    <g transform="translate(1170 225)">
      <rect width="375" height="300" rx="26" fill="#0b3328" fill-opacity=".97" stroke="#d2aa46" stroke-width="2"/>
      <circle cx="51" cy="50" r="25" fill="#79bd8f"/>
      <g transform="translate(37 36)" stroke="#173c2e" stroke-width="3" fill="none">
        <circle cx="14" cy="14" r="12"/><path d="M7 14h14M14 7v14"/>
      </g>
      <text x="95" y="48" font-size="25" font-weight="800" fill="#f4efd9">Interpretation boundary</text>
      <text x="95" y="76" font-size="15" font-weight="700" fill="#b8d8ad">What we can — and cannot — claim</text>
      <line x1="28" y1="105" x2="347" y2="105" stroke="#547965"/>

      <text x="34" y="145" font-size="16" fill="#e7e0c9">• Public-only candidates ≠ canonical final</text>
      <text x="34" y="184" font-size="16" fill="#e7e0c9">• Historical refs must name their baseline</text>
      <text x="34" y="223" font-size="16" fill="#e7e0c9">• Competition research, not clinical use</text>

      <rect x="32" y="252" width="311" height="31" rx="15" fill="#153f31" stroke="#6fa683"/>
      <text x="187" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#b9d8ad">Transparent evidence over headline claims</text>
    </g>
  </g>

  <!-- subtle evidence path -->
  <g transform="translate(560 555)" fill="none" stroke="#d9b64d" stroke-width="2.5" opacity=".8">
    <path d="M0 24 C75 -10 150 56 230 20 S385 13 455 26 S600 37 680 5"/>
    <circle cx="0" cy="24" r="5" fill="#79bd8f"/>
    <circle cx="230" cy="20" r="5" fill="#e9c15e"/>
    <circle cx="455" cy="26" r="5" fill="#79bd8f"/>
    <circle cx="680" cy="5" r="7" fill="#e9c15e" filter="url(#glow)"/>
  </g>

  <line x1="58" y1="590" x2="1542" y2="590" stroke="#7fb28a" stroke-opacity=".6"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="78" y="625" font-size="14" font-weight="700" letter-spacing="4" fill="#d4c17e">EVIDENCE · CONTEXT · REPRODUCIBILITY · HUMILITY</text>
    <text x="1518" y="625" text-anchor="end" font-size="14" letter-spacing="3" fill="#9fc49f">UNDERSTAND STRESS. BRIGHTER DAYS AHEAD.</text>
  </g>
</svg>