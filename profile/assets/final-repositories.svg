<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Final repository map animation</title>
  <desc id="desc">Text-free animated diagram showing three private individual research repositories feeding a shared UNIFIED lineage hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="0.55" stop-color="#F1F7F4"/>
      <stop offset="1" stop-color="#FBF7EA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65B18F"/>
      <stop offset="1" stop-color="#164C3A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D578"/>
      <stop offset="1" stop-color="#B47B15"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123F33" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .node{transform-box:fill-box;transform-origin:center;animation:lift 8s ease-in-out infinite}
      .n2{animation-delay:1.8s}.n3{animation-delay:3.6s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 1.2s}
      .flow{stroke-dasharray:12 11;animation:flow 7s linear infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
      .orbit2{transform-box:fill-box;transform-origin:center;animation:spinReverse 28s linear infinite}
      @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-220}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinReverse{to{transform:rotate(-360deg)}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="85" cy="345" r="155" fill="#B8E1CF" opacity=".13"/>
  <circle cx="1110" cy="5" r="180" fill="#F0DC95" opacity=".14"/>

  <!-- JH research node -->
  <g class="node" filter="url(#shadow)">
    <rect x="55" y="52" width="260" height="190" rx="30" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <rect x="93" y="84" width="184" height="126" rx="22" fill="#EEF7F2" stroke="#69AE8F" stroke-width="2"/>
    <circle cx="139" cy="128" r="17" fill="#D8ECE2" stroke="#4E9776" stroke-width="2"/>
    <path d="M129 128h20M139 118v20" stroke="#347A5D" stroke-width="2.6" stroke-linecap="round"/>
    <g stroke="#4D9474" stroke-width="2" fill="none">
      <path d="M182 116l28 26 30-25M182 174l28-32 30 32"/>
    </g>
    <circle cx="182" cy="116" r="7" fill="#5BA282"/>
    <circle class="pulse" cx="210" cy="142" r="9" fill="url(#green)"/>
    <circle cx="240" cy="117" r="7" fill="#72B495"/>
    <circle cx="182" cy="174" r="7" fill="#68AA8D"/>
    <circle class="pulse2" cx="240" cy="174" r="7" fill="#D0A039"/>
    <g>
      <rect x="242" y="71" width="34" height="28" rx="7" fill="#F6EDCF" stroke="#C69527" stroke-width="1.8"/>
      <path d="M249 71v-7c0-8 5-13 10-13s10 5 10 13v7" fill="none" stroke="#A97816" stroke-width="2"/>
    </g>
  </g>

  <!-- BS research node -->
  <g class="node n2" filter="url(#shadow)">
    <rect x="470" y="52" width="260" height="190" rx="30" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <rect x="508" y="84" width="184" height="126" rx="22" fill="#EEF7F2" stroke="#69AE8F" stroke-width="2"/>
    <g stroke="#347A5D" stroke-width="2.4" fill="none">
      <path d="M570 106v24M570 130l-31 25M570 130l31 25M539 155l-20 24M539 155l20 24M601 155l-20 24M601 155l20 24"/>
    </g>
    <circle cx="570" cy="106" r="10" fill="#2F7658"/>
    <circle cx="539" cy="155" r="8" fill="#5BA183"/>
    <circle class="pulse" cx="601" cy="155" r="8" fill="#4B9373"/>
    <circle cx="519" cy="179" r="6" fill="#6BAC8F"/>
    <circle cx="559" cy="179" r="6" fill="#5EA285"/>
    <circle cx="581" cy="179" r="6" fill="#70B294"/>
    <circle class="pulse2" cx="621" cy="179" r="6" fill="#CB9B2E"/>
    <path d="M642 112h31M642 126h23M642 140h31" stroke="#C69A30" stroke-width="3" stroke-linecap="round"/>
    <g>
      <rect x="657" y="71" width="34" height="28" rx="7" fill="#F6EDCF" stroke="#C69527" stroke-width="1.8"/>
      <path d="M664 71v-7c0-8 5-13 10-13s10 5 10 13v7" fill="none" stroke="#A97816" stroke-width="2"/>
    </g>
  </g>

  <!-- SK research node -->
  <g class="node n3" filter="url(#shadow)">
    <rect x="885" y="52" width="260" height="190" rx="30" fill="#FFFFFF" stroke="#E0D2A0" stroke-width="2"/>
    <rect x="923" y="84" width="184" height="126" rx="22" fill="#FBF4DA" stroke="#D1A43A" stroke-width="2"/>
    <circle cx="995" cy="147" r="36" fill="#EEF7F2" stroke="#67AB8C" stroke-width="2"/>
    <circle cx="995" cy="147" r="10" fill="url(#green)"/>
    <path d="M995 108v18M995 168v18M956 147h18M1016 147h18M968 120l13 13M1009 161l13 13M1022 120l-13 13M981 161l-13 13" stroke="#3E8264" stroke-width="2.2" stroke-linecap="round"/>
    <circle class="pulse" cx="1060" cy="122" r="8" fill="#D0A139"/>
    <circle class="pulse2" cx="1068" cy="174" r="7" fill="#69AD8E"/>
    <path d="M1044 143c11-18 27-19 39-5M1046 152c11 13 27 14 38 2" fill="none" stroke="#B88820" stroke-width="2.1" stroke-linecap="round"/>
    <g>
      <rect x="1072" y="71" width="34" height="28" rx="7" fill="#F6EDCF" stroke="#C69527" stroke-width="1.8"/>
      <path d="M1079 71v-7c0-8 5-13 10-13s10 5 10 13v7" fill="none" stroke="#A97816" stroke-width="2"/>
    </g>
  </g>

  <!-- flows to UNIFIED -->
  <path d="M185 242 C280 302 415 301 535 294" fill="none" stroke="#5A9F80" stroke-width="3.5" class="flow"/>
  <path d="M600 242 V269" fill="none" stroke="#66AA8D" stroke-width="3.5" class="flow"/>
  <path d="M1015 242 C920 302 785 301 665 294" fill="none" stroke="#C4962B" stroke-width="3.5" class="flow"/>

  <!-- UNIFIED hub -->
  <g filter="url(#shadow)">
    <rect x="520" y="268" width="160" height="66" rx="25" fill="#FFFFFF" stroke="#D1A43A" stroke-width="2.5"/>
    <rect x="548" y="282" width="74" height="38" rx="10" fill="#EEF7F2" stroke="#5CA183" stroke-width="2"/>
    <rect x="565" y="275" width="74" height="38" rx="10" fill="#F8F0D4" stroke="#C8992C" stroke-width="2"/>
    <circle class="pulse" cx="648" cy="301" r="10" fill="url(#gold)" filter="url(#glow)"/>
  </g>
  <g class="orbit" opacity=".34">
    <ellipse cx="600" cy="301" rx="112" ry="28" fill="none" stroke="#4F9274" stroke-width="1.4" stroke-dasharray="7 9"/>
  </g>
  <g class="orbit2" opacity=".30">
    <ellipse cx="600" cy="301" rx="136" ry="18" fill="none" stroke="#D0A43A" stroke-width="1.2" stroke-dasharray="6 10"/>
  </g>
</svg>