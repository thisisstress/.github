<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Final experiment status animation</title>
  <desc id="desc">Text-free animated experiment history showing three lineage milestones leading to a final adopted model, with an independent alternative branch and a public-only candidate kept outside the final selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="0.56" stop-color="#F1F7F4"/>
      <stop offset="1" stop-color="#FBF7EA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66B18F"/>
      <stop offset="1" stop-color="#174D3B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D77D"/>
      <stop offset="1" stop-color="#B47A15"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62A98A"/>
      <stop offset="0.68" stop-color="#3D8264"/>
      <stop offset="1" stop-color="#D2A33A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123F33" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card{transform-box:fill-box;transform-origin:center;animation:lift 10s ease-in-out infinite}
      .c2{animation-delay:1.5s}.c3{animation-delay:3s}.c4{animation-delay:4.5s}.c5{animation-delay:6s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 1.2s}
      .flow{stroke-dasharray:13 11;animation:flow 7s linear infinite}
      .flowSlow{stroke-dasharray:7 12;animation:flow 10s linear infinite reverse}
      .check{stroke-dasharray:64;stroke-dashoffset:64;animation:check 5.5s ease-in-out infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
      @keyframes lift{0%,16%,100%{transform:translateY(0)}8%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-240}}
      @keyframes check{0%,28%{stroke-dashoffset:64}56%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="1200" height="350" rx="28" fill="url(#bg)"/>
  <circle cx="95" cy="340" r="160" fill="#B8E0CE" opacity=".13"/>
  <circle cx="1110" cy="8" r="180" fill="#F0DC94" opacity=".14"/>

  <!-- main lineage rail -->
  <path d="M120 146 H845" fill="none" stroke="#D7E4DD" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 146 H845" fill="none" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" class="flow"/>
  <circle r="6" fill="#D1A239" filter="url(#glow)">
    <animateMotion dur="7.5s" repeatCount="indefinite" path="M120 146 H845"/>
  </circle>

  <!-- V7 milestone -->
  <g class="card" filter="url(#shadow)">
    <rect x="48" y="62" width="205" height="168" rx="28" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <circle cx="150" cy="146" r="49" fill="#EDF7F2" stroke="#63A98A" stroke-width="2"/>
    <g stroke="#397F61" stroke-width="2" fill="none">
      <path d="M132 119v19M132 138l-18 16M132 138l18 16"/>
      <path d="M163 164l17-13M163 151l17 13"/>
    </g>
    <circle class="pulse" cx="132" cy="119" r="8" fill="#2E7357"/>
    <circle cx="114" cy="154" r="6" fill="#5EA487"/>
    <circle cx="150" cy="154" r="6" fill="#5EA487"/>
    <circle cx="163" cy="151" r="6" fill="#6BAC8F"/>
    <circle class="pulse2" cx="180" cy="164" r="6" fill="#C99A2B"/>
  </g>

  <!-- V34 milestone -->
  <g class="card c2" filter="url(#shadow)">
    <rect x="298" y="62" width="205" height="168" rx="28" fill="#FFFFFF" stroke="#D5E5DD" stroke-width="2"/>
    <circle cx="400" cy="146" r="49" fill="#EEF7F3" stroke="#67AC8D" stroke-width="2"/>
    <circle cx="382" cy="139" r="18" fill="#DDEFE7" stroke="#4D9273" stroke-width="2"/>
    <circle cx="420" cy="153" r="18" fill="#E8F4EE" stroke="#6CAC8F" stroke-width="2"/>
    <path d="M397 146h8" stroke="#B4861C" stroke-width="4" stroke-linecap="round"/>
    <circle class="pulse" cx="400" cy="146" r="7" fill="#D0A238" filter="url(#glow)"/>
  </g>

  <!-- final adopted -->
  <g class="card c3" filter="url(#shadow)">
    <rect x="548" y="52" width="235" height="188" rx="30" fill="#FFFFFF" stroke="#E1C971" stroke-width="3"/>
    <circle cx="665" cy="146" r="58" fill="#FBF4DB" stroke="#D1A43A" stroke-width="2.5"/>
    <path d="M623 169l22-25 18 15 37-46" fill="none" stroke="#397F61" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="623" cy="169" r="5" fill="#5EA487"/>
    <circle cx="645" cy="144" r="5" fill="#5EA487"/>
    <circle cx="663" cy="159" r="5" fill="#5EA487"/>
    <circle class="pulse" cx="700" cy="113" r="8" fill="url(#gold)" filter="url(#glow)"/>
    <path class="check" d="M639 188l15 14 34-38" fill="none" stroke="#B8841D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="orbit" opacity=".35"><ellipse cx="665" cy="146" rx="78" ry="27" fill="none" stroke="#D0A43A" stroke-width="1.5" stroke-dasharray="7 9"/></g>
  </g>

  <!-- independent branch -->
  <path d="M400 230 C400 272 512 286 614 286" fill="none" stroke="#64A98A" stroke-width="3" class="flowSlow"/>
  <g class="card c4" filter="url(#shadow)">
    <rect x="510" y="258" width="208" height="70" rx="25" fill="#FFFFFF" stroke="#CFE2D8" stroke-width="2"/>
    <circle cx="548" cy="293" r="22" fill="#EDF7F2" stroke="#65AA8A" stroke-width="2"/>
    <g fill="#4B9273"><circle cx="540" cy="286" r="5"/><circle cx="556" cy="286" r="5"/><circle cx="548" cy="301" r="6"/></g>
    <path d="M540 286l8 15 8-15" fill="none" stroke="#4B9273" stroke-width="1.8"/>
    <circle class="pulse2" cx="683" cy="293" r="7" fill="#69AD8E"/>
  </g>

  <!-- public-only branch / not adopted -->
  <path d="M783 146 C850 146 880 185 920 220" fill="none" stroke="#BCA76E" stroke-width="3" class="flowSlow"/>
  <g class="card c5" filter="url(#shadow)">
    <rect x="900" y="184" width="250" height="144" rx="30" fill="#FFFFFF" stroke="#DDD5B8" stroke-width="2"/>
    <circle cx="1025" cy="248" r="47" fill="#F8F5EA" stroke="#C9B77D" stroke-width="2"/>
    <path d="M992 260l23-25 17 12 26-35" fill="none" stroke="#7C8E80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="992" cy="260" r="5" fill="#8DA194"/>
    <circle cx="1015" cy="235" r="5" fill="#8DA194"/>
    <circle cx="1032" cy="247" r="5" fill="#8DA194"/>
    <circle cx="1058" cy="212" r="6" fill="#B69B51" opacity=".8"/>
    <path d="M987 291h76" stroke="#C7B98D" stroke-width="4" stroke-linecap="round"/>
    <path d="M1018 282l15 18" stroke="#A98E45" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- final status beacon -->
  <path d="M783 146h62" stroke="#C89A2B" stroke-width="4" stroke-linecap="round" class="flow"/>
  <circle cx="868" cy="146" r="24" fill="#FBF2D2" stroke="#D0A23A" stroke-width="2"/>
  <circle class="pulse" cx="868" cy="146" r="10" fill="url(#gold)" filter="url(#glow)"/>
</svg>