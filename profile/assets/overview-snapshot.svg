</g>
<g transform="translate(1240 92)" stroke="#dbb85a" stroke-width="2.6" fill="none"><path d="M64 92V52M64 57L34 30M64 57L95 30M34 30L16 12M34 30L48 8M95 30L80 9M95 30L114 13"/><g fill="#e6bd56" stroke="none"><circle cx="64" cy="92" r="6"/><circle cx="34" cy="30" r="5"/><circle cx="95" cy="30" r="5"/><circle cx="16" cy="12" r="4"/><circle cx="48" cy="8" r="4"/><circle cx="80" cy="9" r="4"/><circle cx="114" cy="13" r="4"/></g></g>
<g transform="translate(1512 112)" filter="url(#microGlow)"><circle r="42" fill="url(#halo)"/><circle r="28" fill="none" stroke="#dfb44c" stroke-opacity=".55"/><circle r="11" fill="#e8bd56"><animate attributeName="opacity" values=".7;1;.7" dur="8s" repeatCount="indefinite"/></circle><circle r="4" fill="#fff1b6"/></g>
<g transform="translate(56 238)" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
  <g><rect width="232" height="190" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><text x="26" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#a8d7b1">TASK</text><text x="26" y="92" font-size="26" font-weight="850" fill="#f5efdf">Tabular</text><text x="26" y="124" font-size="26" font-weight="850" fill="#f5efdf">regression</text><rect x="24" y="144" width="184" height="30" rx="12" fill="#0d3c2f" stroke="#5b9e73"/><text x="116" y="165" text-anchor="middle" font-size="15" letter-spacing="1.3" fill="#cde0bc">stress_score</text></g>
  <g transform="translate(248)"><rect width="232" height="190" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><text x="26" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#a8d7b1">TRAIN</text><text x="26" y="110" font-size="44" font-weight="850" fill="#f0ca69">3,000</text><text x="26" y="148" font-size="17" fill="#dce8d2">rows</text></g>
  <g transform="translate(496)"><rect width="232" height="190" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><text x="26" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#a8d7b1">METRIC</text><text x="26" y="112" font-size="48" font-weight="850" fill="#f5efdf">MAE</text><text x="26" y="148" font-size="16" fill="#dce8d2">lower is better</text></g>
  <g transform="translate(744)"><rect width="232" height="190" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><text x="26" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#a8d7b1">FINAL BLEND</text><text x="26" y="96" font-size="35" font-weight="850" fill="#f0ca69">76% + 24%</text><text x="26" y="126" font-size="14" fill="#f2eddc">ExtraTrees + Pair-Neighbor</text><rect x="24" y="146" width="170" height="28" rx="11" fill="#0d3c2f" stroke="#5b9e73"/><text x="109" y="165" text-anchor="middle" font-size="13" fill="#e8c95f">BS 8/6 adopted</text></g>
  <g transform="translate(992)"><rect width="232" height="190" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><text x="26" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#a8d7b1">PUBLIC MAE</text><text x="26" y="111" font-size="44" font-weight="850" fill="#f5efdf">0.1267</text><text x="26" y="149" font-size="16" fill="#dce8d2">leaderboard</text></g>
  <g transform="translate(1240)"><rect width="232" height="190" rx="22" fill="url(#card)" stroke="#d3aa49" stroke-width="1.8" filter="url(#cardShadow)"/><text x="26" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#a8d7b1">PRIVATE MAE</text><text x="26" y="111" font-size="44" font-weight="850" fill="#f5efdf">0.1473</text><text x="26" y="149" font-size="16" fill="#dce8d2">final evaluation</text></g>
</g>
