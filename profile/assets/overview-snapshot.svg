      <circle cx="1494" cy="178" r="1.9" opacity=".30"><animate attributeName="opacity" values=".12;.44;.12" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    </g><g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
  <text x="72" y="80" font-size="16" font-weight="700" letter-spacing="5" fill="#b5d8ae">PROJECT SNAPSHOT</text>
