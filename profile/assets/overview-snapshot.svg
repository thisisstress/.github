<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" overflow="hidden">
<title id="title">THIS IS STRESS project snapshot</title>
<desc id="desc">Aligned project snapshot with task, training rows, metric, final blend, public MAE and private MAE.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06271f"/><stop offset=".56" stop-color="#0a382b"/><stop offset="1" stop-color="#071f19"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6ead0"/><stop offset=".5" stop-color="#e7bd58"/><stop offset="1" stop-color="#bd7c22"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c3a2d"/><stop offset="1" stop-color="#082b22"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6bb589" stop-opacity="0"/><stop offset=".55" stop-color="#9ed7ae" stop-opacity=".20"/><stop offset="1" stop-color="#e9bd58" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#e8bd58" stop-opacity=".35"/><stop offset="1" stop-color="#e8bd58" stop-opacity="0"/></radialGradient>

    <radialGradient id="ambientEmerald"><stop stop-color="#75c796" stop-opacity=".20"/><stop offset="1" stop-color="#75c796" stop-opacity="0"/></radialGradient>
    <radialGradient id="ambientGold"><stop stop-color="#e7bd58" stop-opacity=".22"/><stop offset="1" stop-color="#e7bd58" stop-opacity="0"/></radialGradient>
    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00150f" flood-opacity=".18"/>
    </filter>
    <filter id="microGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<rect x="24" y="24" width="1552" height="472" rx="24" fill="none" stroke="#79b88d" stroke-opacity=".76" stroke-width="2"/>
<rect x="36" y="36" width="1528" height="448" rx="20" fill="none" stroke="#83c69a" stroke-opacity=".24"/>
