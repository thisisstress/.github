      <animate attributeName="opacity" values=".65;1;.65" dur="8s" repeatCount="indefinite"/>
    </circle>
  <line x1="370" y1="74" x2="620" y2="74" stroke="#d4aa45" stroke-opacity=".55"/>
  <text x="72" y="145" font-size="56" font-weight="850"><tspan fill="#f5efdf">Stress score </tspan><tspan fill="url(#gold)">regression</tspan></text>
  <text x="72" y="188" font-size="21" fill="#afd0ae">A compact view of the final task, model blend and evaluation results.</text>
  <text x="1528" y="70" text-anchor="end" font-size="14" font-weight="700" letter-spacing="4" fill="#b5d8ae">DATA · MODELS · INSIGHTS</text>
</g>
