<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">THIS IS STRESS project snapshot</title>
<desc id="desc">Project snapshot with task, training rows, metric, final blend, public and private MAE.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#072b21"/><stop offset=".55" stop-color="#0b392c"/><stop offset="1" stop-color="#07271f"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7ecc4"/><stop offset=".5" stop-color="#e8be59"/><stop offset="1" stop-color="#b7791f"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00150f" flood-opacity=".35"/></filter>
</defs>
<rect width="1600" height="520" rx="30" fill="url(#bg)"/>
<rect x="22" y="22" width="1556" height="476" rx="27" fill="none" stroke="#9bc69f" stroke-opacity=".55" stroke-width="2"/>
<circle cx="1450" cy="60" r="210" fill="#dcae42" opacity=".05"/>
<g font-family="Inter, Arial, sans-serif">
 <text x="70" y="82" font-size="17" font-weight="700" letter-spacing="5" fill="#b8d7ad">PROJECT SNAPSHOT</text>
 <line x1="325" y1="77" x2="402" y2="77" stroke="#e7bd58" stroke-width="3"/>
 <text x="70" y="148" font-size="52" font-weight="850" fill="#f6efd9">Stress score regression</text>
 <text x="70" y="185" font-size="21" fill="#a9caa8">A compact view of the final task, model blend and evaluation results.</text>
 <text x="1515" y="80" text-anchor="end" font-size="14" font-weight="700" letter-spacing="3" fill="#d6c17d">DATA · MODELS · PEOPLE</text>
</g>
<g transform="translate(55 238)" filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
  <g transform="translate(0 0)"><rect width="235" height="190" rx="24" fill="#0b3328" stroke="#79af86" stroke-width="1.6"/><text x="24" y="42" font-size="15" fill="#a8c9a8">TASK</text><text x="24" y="88" font-size="24" font-weight="800" fill="#f4efd9">Tabular</text><text x="24" y="121" font-size="24" font-weight="800" fill="#f4efd9">regression</text><text x="24" y="160" font-size="14" fill="#d6c78f">stress_score</text></g>
  <g transform="translate(255 0)"><rect width="235" height="190" rx="24" fill="#0b3328" stroke="#79af86" stroke-width="1.6"/><text x="24" y="42" font-size="15" fill="#a8c9a8">TRAIN</text><text x="24" y="103" font-size="38" font-weight="850" fill="#f0d078">3,000</text><text x="24" y="140" font-size="16" fill="#d9e4c8">rows</text></g>
  <g transform="translate(510 0)"><rect width="235" height="190" rx="24" fill="#0b3328" stroke="#79af86" stroke-width="1.6"/><text x="24" y="42" font-size="15" fill="#a8c9a8">METRIC</text><text x="24" y="106" font-size="42" font-weight="850" fill="#f4efd9">MAE</text><text x="24" y="145" font-size="14" fill="#d6c78f">lower is better</text></g>
  <g transform="translate(765 0)"><rect width="300" height="190" rx="24" fill="#0b3328" stroke="#d0a746" stroke-width="1.9"/><text x="24" y="42" font-size="15" fill="#a8c9a8">FINAL BLEND</text><text x="24" y="94" font-size="28" font-weight="850" fill="#f0d078">76% + 24%</text><text x="24" y="130" font-size="17" fill="#f4efd9">ExtraTrees + Pair-Neighbor</text><text x="24" y="160" font-size="14" fill="#d6c78f">BS 8/6 adopted</text></g>
  <g transform="translate(1085 0)"><rect width="210" height="190" rx="24" fill="#0b3328" stroke="#79af86" stroke-width="1.6"/><text x="24" y="42" font-size="15" fill="#a8c9a8">PUBLIC MAE</text><text x="24" y="106" font-size="35" font-weight="850" fill="#f0d078">0.1267</text><text x="24" y="146" font-size="14" fill="#d6c78f">leaderboard</text></g>
  <g transform="translate(1315 0)"><rect width="210" height="190" rx="24" fill="#0b3328" stroke="#d0a746" stroke-width="1.9"/><text x="24" y="42" font-size="15" fill="#a8c9a8">PRIVATE MAE</text><text x="24" y="106" font-size="35" font-weight="850" fill="#f4efd9">0.1473</text><text x="24" y="146" font-size="14" fill="#d6c78f">final evaluation</text></g>
</g>
</svg>