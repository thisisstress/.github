<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Final team collaboration animation</title>
  <desc id="desc">Text-free animated diagram showing three researchers contributing different work streams into one shared evidence hub and final model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="0.56" stop-color="#F1F7F4"/>
      <stop offset="1" stop-color="#FBF7EA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66B18F"/>
      <stop offset="1" stop-color="#164C3A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D67B"/>
      <stop offset="1" stop-color="#B37A15"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123F33" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .person{transform-box:fill-box;transform-origin:center;animation:lift 7.5s ease-in-out infinite}
      .p2{animation-delay:1.8s}.p3{animation-delay:3.6s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}
      .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite 1.2s}
      .flow{stroke-dasharray:12 11;animation:flow 7s linear infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
      .orbit2{transform-box:fill-box;transform-origin:center;animation:spinReverse 27s linear infinite}
      @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-220}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinReverse{to{transform:rotate(-360deg)}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="345" r="160" fill="#B8E0CE" opacity=".13"/>
  <circle cx="1110" cy="10" r="180" fill="#F0DC94" opacity=".14"/>

  <!-- researcher 1 -->
  <g class="person" filter="url(#shadow)">
    <rect x="52" y="70" width="245" height="220" rx="30" fill="#FFFFFF" stroke="#D6E5DE" stroke-width="2"/>
    <circle cx="174" cy="136" r="42" fill="#EAF5EF" stroke="#5DA787" stroke-width="2"/>
    <circle cx="174" cy="125" r="17" fill="#5B9D80"/>
    <path d="M143 169c7-25 55-25 62 0" fill="#D8EBE2" stroke="#4F9073" stroke-width="2"/>
    <g stroke="#4B8E70" stroke-width="2.2" fill="none">
      <path d="M118 218h112M137 199v38M174 190v47M211 204v33"/>
      <path d="M124 228c22-16 43-9 50-23 10 14 30 7 50 23"/>
    </g>
    <circle class="pulse" cx="174" cy="205" r="7" fill="#4C9475"/>
  </g>

  <!-- researcher 2 -->
  <g class="person p2" filter="url(#shadow)">
    <rect x="477" y="70" width="245" height="220" rx="30" fill="#FFFFFF" stroke="#D6E5DE" stroke-width="2"/>
    <circle cx="599" cy="136" r="42" fill="#EEF7F2" stroke="#67AC8D" stroke-width="2"/>
    <circle cx="599" cy="125" r="17" fill="#6AAE90"/>
    <path d="M568 169c7-25 55-25 62 0" fill="#DDEFE7" stroke="#5D9D81" stroke-width="2"/>
    <g stroke="#347A5D" stroke-width="2.3" fill="none">
      <path d="M599 195v22M599 217l-30 24M599 217l30 24"/>
    </g>
    <circle cx="599" cy="195" r="9" fill="#2E7357"/>
    <circle cx="569" cy="241" r="7" fill="#5AA184"/>
    <circle class="pulse2" cx="629" cy="241" r="7" fill="#C99A2B"/>
  </g>

  <!-- researcher 3 -->
  <g class="person p3" filter="url(#shadow)">
    <rect x="902" y="70" width="245" height="220" rx="30" fill="#FFFFFF" stroke="#E0D2A0" stroke-width="2"/>
    <circle cx="1024" cy="136" r="42" fill="#FBF3D9" stroke="#D0A43A" stroke-width="2"/>
    <circle cx="1024" cy="125" r="17" fill="#C9972B"/>
    <path d="M993 169c7-25 55-25 62 0" fill="#F1E6BE" stroke="#B7841C" stroke-width="2"/>
    <g fill="none" stroke="#4D8E70" stroke-width="2.1">
      <circle cx="1003" cy="219" r="17"/>
      <circle cx="1045" cy="219" r="17"/>
      <path d="M1019 219h10M1003 202l42 34M1045 202l-42 34"/>
    </g>
    <circle class="pulse" cx="1024" cy="219" r="6" fill="url(#gold)" filter="url(#glow)"/>
  </g>

  <!-- shared evidence hub -->
  <g filter="url(#shadow)">
    <circle cx="599" cy="321" r="28" fill="#FFFFFF" stroke="#D1A43A" stroke-width="2.5"/>
    <circle cx="599" cy="321" r="16" fill="url(#gold)" filter="url(#glow)"/>
  </g>

  <!-- contribution flows -->
  <path d="M174 290 C240 328 390 325 563 321" fill="none" stroke="#5B9F80" stroke-width="3.5" class="flow"/>
  <path d="M599 290 V293" fill="none" stroke="#6AAC8E" stroke-width="3.5"/>
  <path d="M1024 290 C952 328 812 325 635 321" fill="none" stroke="#C69A30" stroke-width="3.5" class="flow"/>

  <!-- shared model orbit -->
  <g class="orbit" opacity=".35">
    <ellipse cx="599" cy="321" rx="76" ry="24" fill="none" stroke="#4F9274" stroke-width="1.5" stroke-dasharray="7 9"/>
  </g>
  <g class="orbit2" opacity=".32">
    <ellipse cx="599" cy="321" rx="96" ry="15" fill="none" stroke="#D0A43A" stroke-width="1.3" stroke-dasharray="6 10"/>
  </g>
</svg>