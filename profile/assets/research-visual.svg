<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Reusable research flow visual</title>
  <desc id="desc">A text-free animated illustration showing health signals flowing into hybrid modeling and then into shared evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="0.52" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#e7f1eb"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174d3e"/>
      <stop offset="1" stop-color="#0d332a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99628"/>
      <stop offset="0.55" stop-color="#e0b84d"/>
      <stop offset="1" stop-color="#f0d177"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0b2e25" flood-opacity=".13"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card { transform-box: fill-box; transform-origin: center; animation: float 8s ease-in-out infinite; }
      .card2 { animation-delay: -2.6s; }
      .card3 { animation-delay: -5.2s; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
      .pulse2 { animation-delay: -1.2s; }
      .pulse3 { animation-delay: -2.4s; }
      .flow { stroke-dasharray: 14 14; animation: dash 7s linear infinite; }
      .packet { offset-path: path('M 288 165 C 360 165 384 165 456 165 C 528 165 552 165 624 165 C 696 165 720 165 792 165 C 864 165 888 165 960 165'); animation: travel 8s ease-in-out infinite; }
      .packet2 { animation-delay: -4s; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
      .orbit2 { animation: spinReverse 24s linear infinite; }
      .spark { animation: twinkle 4.8s ease-in-out infinite; }
      .spark2 { animation-delay: -1.6s; }
      .spark3 { animation-delay: -3.2s; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes pulse { 0%,100%{transform:scale(.9);opacity:.64} 50%{transform:scale(1.12);opacity:1} }
      @keyframes dash { to{stroke-dashoffset:-280} }
      @keyframes travel { 0%{offset-distance:0%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes spin { to{transform:rotate(360deg)} }
      @keyframes spinReverse { to{transform:rotate(-360deg)} }
      @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.85} }
    </style>
  </defs>

  <rect width="1200" height="330" rx="30" fill="url(#bg)"/>
  <circle cx="120" cy="-18" r="170" fill="#66a889" opacity=".07"/>
  <circle cx="1085" cy="350" r="210" fill="#d8aa38" opacity=".055"/>

  <path d="M288 165 C360 165 384 165 456 165 C528 165 552 165 624 165 C696 165 720 165 792 165 C864 165 888 165 960 165" fill="none" stroke="#bdd3c7" stroke-width="7" stroke-linecap="round"/>
  <path class="flow" d="M288 165 C360 165 384 165 456 165 C528 165 552 165 624 165 C696 165 720 165 792 165 C864 165 888 165 960 165" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <circle class="packet" cx="0" cy="0" r="8" fill="#e5b84b" filter="url(#glow)"/>
  <circle class="packet packet2" cx="0" cy="0" r="5" fill="#4f9b79"/>

  <!-- Health signals -->
  <g class="card" filter="url(#shadow)">
    <rect x="42" y="70" width="250" height="190" rx="32" fill="#ffffff" stroke="#7eb297" stroke-width="2"/>
    <circle cx="167" cy="165" r="67" fill="#edf6f1" stroke="#c9ddd2" stroke-width="2"/>
    <circle cx="167" cy="165" r="52" fill="#ffffff" stroke="#79aa92" stroke-width="2" opacity=".94"/>
    <path d="M116 169 H139 L149 145 L164 188 L181 156 L193 169 H218" fill="none" stroke="#2d7c5d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="149" cy="145" r="7" fill="#d8a934"/>
    <circle class="pulse pulse2" cx="181" cy="156" r="6" fill="#63a886"/>
    <circle cx="111" cy="110" r="5" fill="#d8a934" opacity=".72"/>
    <circle cx="225" cy="116" r="4" fill="#6da88b" opacity=".62"/>
    <circle cx="103" cy="220" r="4" fill="#6da88b" opacity=".46"/>
    <circle cx="230" cy="222" r="6" fill="#d8a934" opacity=".46"/>
  </g>

  <!-- Hybrid model -->
  <g class="card card2" filter="url(#shadow)">
    <rect x="475" y="52" width="250" height="226" rx="34" fill="url(#emerald)" stroke="#d7aa37" stroke-width="2.5"/>
    <ellipse class="orbit" cx="600" cy="165" rx="88" ry="62" fill="none" stroke="#d8aa37" stroke-width="2" opacity=".48"/>
    <ellipse class="orbit2" cx="600" cy="165" rx="73" ry="91" fill="none" stroke="#6da88b" stroke-width="2" opacity=".4"/>
    <g stroke="#cce4d7" stroke-width="3" opacity=".82">
      <line x1="600" y1="92" x2="554" y2="144"/>
      <line x1="600" y1="92" x2="646" y2="144"/>
      <line x1="554" y1="144" x2="528" y2="205"/>
      <line x1="554" y1="144" x2="579" y2="205"/>
      <line x1="646" y1="144" x2="621" y2="205"/>
      <line x1="646" y1="144" x2="672" y2="205"/>
    </g>
    <circle class="pulse" cx="600" cy="92" r="12" fill="#e3b33f" filter="url(#glow)"/>
    <circle cx="554" cy="144" r="10" fill="#6db08d" stroke="#d7aa37" stroke-width="2"/>
    <circle cx="646" cy="144" r="10" fill="#6db08d" stroke="#d7aa37" stroke-width="2"/>
    <circle cx="528" cy="205" r="8" fill="#dcece4" stroke="#6ba287" stroke-width="2"/>
    <circle cx="579" cy="205" r="8" fill="#d8a934" stroke="#f0d177" stroke-width="2"/>
    <circle cx="621" cy="205" r="8" fill="#dcece4" stroke="#6ba287" stroke-width="2"/>
    <circle cx="672" cy="205" r="8" fill="#d8a934" stroke="#f0d177" stroke-width="2"/>
    <circle class="spark" cx="518" cy="110" r="3" fill="#f0d177"/>
    <circle class="spark spark2" cx="688" cy="112" r="4" fill="#79b596"/>
    <circle class="spark spark3" cx="520" cy="240" r="3" fill="#79b596"/>
    <circle class="spark spark2" cx="690" cy="236" r="3" fill="#f0d177"/>
  </g>

  <!-- Shared evidence -->
  <g class="card card3" filter="url(#shadow)">
    <rect x="908" y="70" width="250" height="190" rx="32" fill="#ffffff" stroke="#d4b45f" stroke-width="2"/>
    <circle cx="1033" cy="165" r="69" fill="#f8f5e9" stroke="#e5d6a6" stroke-width="2"/>
    <rect x="992" y="117" width="82" height="96" rx="15" fill="#ffffff" stroke="#497e67" stroke-width="3"/>
    <path d="M1009 144 H1056 M1009 163 H1047 M1009 182 H1038" stroke="#7aa58f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1064" cy="190" r="23" fill="#174d3e" stroke="#d7aa37" stroke-width="3"/>
    <path d="M1053 190 L1061 198 L1076 181" fill="none" stroke="#f2d072" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse pulse3" cx="1064" cy="190" r="29" fill="none" stroke="#d7aa37" stroke-width="2" opacity=".35"/>
    <circle cx="972" cy="121" r="5" fill="#6da88b" opacity=".65"/>
    <circle cx="1100" cy="118" r="4" fill="#d8a934" opacity=".7"/>
    <circle cx="974" cy="226" r="4" fill="#d8a934" opacity=".48"/>
    <circle cx="1102" cy="226" r="5" fill="#6da88b" opacity=".45"/>
  </g>
</svg>