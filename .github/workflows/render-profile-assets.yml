name: Validate organization profile

on:
  push:
    branches:
      - main
    paths:
      - "profile/**"
      - "scripts/validate_profile.py"
      - ".github/workflows/render-profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-profile-validation
  cancel-in-progress: true

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate organization profile
        run: python scripts/validate_profile.py

      - name: Check whitespace
        run: git diff --check
