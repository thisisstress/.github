name: Render organization profile assets

on:
  push:
    branches:
      - main
    paths:
      - "profile/content.json"
      - "scripts/render_assets.py"
      - "scripts/validate_profile.py"
      - "requirements.txt"
      - ".github/workflows/render-profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organization-profile-assets
  cancel-in-progress: true

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate profile assets
        run: python scripts/render_assets.py

      - name: Validate organization profile
        run: python scripts/validate_profile.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit regenerated assets
        shell: bash
        run: |
          if git diff --quiet -- profile/assets; then
            echo "No generated asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets
          git commit -m "chore: regenerate organization profile assets"
          git push
