name: Validate organization profile

on:
  push:
    branches:
      - main
    paths:
      - "profile/**"
      - "scripts/validate_profile.py"
      - ".github/workflows/render-profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-profile-validation
  cancel-in-progress: true

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate organization profile
        run: python scripts/validate_profile.py

      - name: Check whitespace
        run: git diff --check

      - name: Install visual QA renderer
        run: python -m pip install --disable-pip-version-check --quiet cairosvg pillow

      - name: Render visual QA preview
        run: python scripts/render_profile_preview.py

      - name: Render Chromium visual QA
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --hide-scrollbars \
            --window-size=1260,4300 \
            --screenshot=artifacts/profile-preview/profile-browser-contact-sheet.png \
            "file://$GITHUB_WORKSPACE/artifacts/profile-preview/browser-preview.html"

      - name: Upload visual QA preview
        uses: actions/upload-artifact@v4
        with:
          name: organization-profile-visual-qa
          path: artifacts/profile-preview/
          retention-days: 7
